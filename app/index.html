<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1012">
<title>Earned Strength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Earned Strength">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Opening animation: logo, wordmark, tagline, then the whole thing lifts away -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-glow"></div>
  <div class="splash-mark">
    <img class="splash-logo" src="icons/logo-512.png" alt="">
  </div>
  <div class="splash-word"><span>EARNED</span><b>STRENGTH</b></div>
  <div class="splash-tag">No myths. No shortcuts.</div>
</div>

<div class="shell" id="shell">
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
</div>

<div class="onboard" id="onboard" hidden></div>
<div class="workout" id="workout" hidden></div>
<div class="builder" id="builder" hidden></div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<button class="rest-pill" id="restPill" type="button" hidden></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
